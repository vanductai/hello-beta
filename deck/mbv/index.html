document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

2Fstyle>\n<style>\n  deck-stage:not(:defined){visibility:hidden}\n  *{margin:0;padding:0;box-sizing:border-box}\n\n  :root{\n    --navy-900:#081a31;\n    --navy-800:#0e2949;\n    --navy-700:#143a63;\n    --navy-600:#1c4b7d;\n    --blue:#2b6cb0;\n    --blue-300:#7fb0e0;\n    --blue-100:#d6e6f6;\n    --amber:#f6ad55;\n    --amber-700:#c97e2c;\n    --paper:#f4f7fb;\n    --paper-2:#eaf0f8;\n    --card:#ffffff;\n    --ink:#0d2138;\n    --ink-2:#3c5168;\n    --ink-3:#6b7e93;\n    --line:#dde6f0;\n    --line-dark:rgba(255,255,255,.14);\n    --good:#2f8f6b;\n    --bad:#c0492f;\n    --star:#f0a92b;\n\n    --pad-x:96px;\n    --pad-y:74px;\n    --maxw:1728px;\n  }\n\n  html,body{background:#05101f;font-family:'Be Vietnam Pro',system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}\n\n  /* ---------- slide frame ---------- */\n  section{\n    background:var(--paper);\n    color:var(--ink);\n    overflow:hidden;\n  }\n  .frame{\n    position:absolute;inset:0;\n    padding:var(--pad-y) var(--pad-x);\n    display:flex;flex-direction:column;\n  }\n  .frame.center{justify-content:center}\n  .midfill{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}\n\n  /* dark variant */\n  section.dark{background:radial-gradient(120% 120% at 80% -10%,var(--navy-700) 0%,var(--navy-900) 60%);color:#eaf1fa}\n  section.dark .h,section.dark .kick-text{color:#fff}\n  section.dark .sub{color:var(--blue-100)}\n  section.dark .foot{color:rgba(255,255,255,.5)}\n  section.dark .foot b{color:rgba(255,255,255,.8)}\n\n  /* ---------- chrome ---------- */\n  .kicker{display:flex;align-items:center;gap:14px;margin-bottom:26px}\n  .kick-dot{width:10px;height:10px;background:var(--amber);transform:rotate(45deg);flex:none}\n  .kick-text{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);white-space:nowrap}\n  .kick-num{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:18px;letter-spacing:.1em;color:var(--ink-3)}\n  section.dark .kick-num{color:rgba(255,255,255,.45)}\n\n  .h{font-weight:800;line-height:1.04;letter-spacing:-.018em;color:var(--ink);text-wrap:balance}\n  .h-xl{font-size:88px}\n  .h-lg{font-size:66px}\n  .h-md{font-size:52px}\n  .h-sm{font-size:40px}\n  .sub{font-size:27px;font-weight:400;color:var(--ink-2);line-height:1.4;max-width:1180px}\n\n  .accent{color:var(--amber-700)}\n  section.dark .accent{color:var(--amber)}\n  .hl{background:linear-gradient(transparent 62%,rgba(246,173,85,.42) 62%);padding:0 .04em}\n\n  /* takeaway strip */\n  .takeaway{margin-top:auto;display:flex;align-items:flex-start;gap:18px;padding-top:30px}\n  .takeaway .bar{width:6px;align-self:stretch;background:var(--amber);flex:none;border-radius:3px}\n  .takeaway p{font-size:25px;line-height:1.42;font-weight:500;color:var(--ink)}\n  section.dark .takeaway p{color:#fff}\n  .takeaway b{font-weight:700}\n\n  /* footer */\n  .foot{position:absolute;left:var(--pad-x);right:var(--pad-x);bottom:34px;display:flex;align-items:center;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:.08em;color:var(--ink-3)}\n  .foot b{font-weight:600;color:var(--ink-2)}\n  .frame.with-foot{padding-bottom:96px}\n\n  /* wordmark */\n  .wm{font-weight:800;letter-spacing:-.02em}\n  .wm .x{color:var(--amber);font-weight:500;margin:0 .28em}\n\n  /* ---------- cards & grids ---------- */\n  .grid{display:grid;gap:22px}\n  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px 32px}\n  section.dark .card{background:rgba(255,255,255,.05);border-color:var(--line-dark)}\n  .num-badge{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:20px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--navy-800);color:#fff;flex:none}\n  section.dark .num-badge{background:var(--amber);color:var(--navy-900)}\n\n  /* pill */\n  .pill{display:inline-flex;align-items:center;gap:9px;padding:9px 18px;border-radius:999px;font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}\n  .pill.amber{background:rgba(246,173,85,.16);color:var(--amber-700)}\n  .pill.blue{background:var(--blue-100);color:var(--blue)}\n  section.dark .pill.blue{background:rgba(127,176,224,.18);color:var(--blue-300)}\n\n  /* icon */\n  .ic{width:30px;height:30px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}\n  .ic-lg{width:40px;height:40px;stroke-width:1.7}\n\n  /* stars */\n  .stars{display:inline-flex;gap:3px;color:var(--star)}\n  .stars svg{width:20px;height:20px;fill:currentColor}\n\n  /* ---------- GBP business card mockup ---------- */\n  .gbp{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 24px 60px -28px rgba(8,26,49,.45);width:100%}\n  .gbp .photo{height:150px;background-image:repeating-linear-gradient(135deg,#dbe6f2 0 14px,#e8f0f8 14px 28px);display:flex;align-items:center;justify-content:center;color:#90a6bd;font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:.08em;border-bottom:1px solid var(--line)}\n  .gbp .body{padding:22px 26px}\n  .gbp .name{font-size:26px;font-weight:700;color:var(--ink);line-height:1.15}\n  .gbp .cat{font-size:16px;color:var(--ink-3);margin-top:3px}\n  .gbp .rate{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:19px}\n  .gbp .rate .score{font-weight:700;color:var(--ink)}\n  .gbp .rate .count{color:var(--ink-3);font-size:16px}\n  .gbp .rows{margin-top:16px;display:flex;flex-direction:column;gap:11px}\n  .gbp .row{display:flex;align-items:center;gap:13px;font-size:17px;color:var(--ink-2)}\n  .gbp .row .ic{width:21px;height:21px;stroke-width:2;color:var(--blue)}\n  .gbp .actions{display:flex;gap:12px;margin-top:20px}\n  .gbp .act{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 6px;border:1px solid var(--line);border-radius:13px;font-size:14px;font-weight:600;color:var(--blue)}\n  .gbp .act .ic{width:23px;height:23px;color:var(--blue)}\n\n  /* map pack result row */\n  .mp{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}\n  .mp .res{display:flex;gap:18px;padding:20px 22px;border-bottom:1px solid var(--line);align-items:center}\n  .mp .res:last-child{border-bottom:0}\n  .mp .res.win{background:linear-gradient(90deg,rgba(246,173,85,.12),transparent 70%);border-left:5px solid var(--amber)}\n  .mp .res .rank{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:18px;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--paper-2);color:var(--ink-2);flex:none}\n  .mp .res.win .rank{background:var(--amber);color:var(--navy-900)}\n  .mp .res .thumb{width:58px;height:58px;border-radius:12px;background:repeating-linear-gradient(135deg,#dbe6f2 0 9px,#e8f0f8 9px 18px);flex:none;display:flex;align-items:center;justify-content:center}\n  .mp .res .thumb .ic{color:var(--navy-600);width:26px;height:26px}\n  .mp .res .meta{flex:1;min-width:0}\n  .mp .res .meta .t{font-size:21px;font-weight:700;color:var(--ink);line-height:1.15}\n  .mp .res .meta .s{font-size:16px;color:var(--ink-3);margin-top:4px;display:flex;align-items:center;gap:8px}\n  .mp .res .quick{display:flex;gap:9px}\n  .mp .res .quick span{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--blue)}\n  .mp .res .quick .ic{width:20px;height:20px}\n\n  /* abstract map backdrop */\n  .mapbg{position:relative;background:#e9eff5;background-image:linear-gradient(rgba(180,198,216,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(180,198,216,.5) 1px,transparent 1px);background-size:46px 46px;border-radius:16px;border:1px solid var(--line);overflow:hidden}\n  .mapbg::before{content:\"\";position:absolute;inset:0;background:linear-gradient(120deg,rgba(127,176,224,.16),transparent 60%)}\n\n  /* comparison table */\n  .ctab{width:100%;border-collapse:separate;border-spacing:0;font-size:21px}\n  .ctab th,.ctab td{text-align:left;padding:18px 24px;vertical-align:middle}\n  .ctab thead th{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}\n  .ctab tbody tr{background:#fff}\n  .ctab tbody td{border-top:1px solid var(--line)}\n  .ctab .lab{font-weight:600;color:var(--ink);width:24%}\n  .ctab .old{color:var(--ink-2)}\n  .ctab .new{color:var(--ink);font-weight:600}\n  .ctab .col-new{background:rgba(43,108,176,.05)}\n\n  /* flow chips */\n  .flow{display:flex;align-items:stretch;gap:0}\n  .flow .step{flex:1;display:flex;flex-direction:column;gap:14px}\n  .flow .arr{display:flex;align-items:center;color:var(--blue-300);padding:0 10px}\n  .flow .arr .ic{width:38px;height:38px;stroke-width:2}\n\n  /* simple two-col split */\n  .split{display:grid;grid-template-columns:1fr 1fr;gap:34px;flex:1;min-height:0}\n  .split.tilt{grid-template-columns:1.05fr .95fr}\n\n  /* big stat */\n  .bigstat{font-weight:800;line-height:.92;letter-spacing:-.03em;font-variant-numeric:tabular-nums}\n\n  /* 9-component chips */\n  .chip9{display:flex;align-items:center;gap:10px;padding:13px 15px;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:17px;font-weight:600;color:var(--ink)}\n  .chip9 .ic{width:21px;height:21px;stroke-width:2;color:var(--blue);flex:none}\n\n  /* 5R cells */\n  .r5{background:rgba(255,255,255,.05);border:1px solid var(--line-dark);border-radius:14px;padding:16px 20px}\n  .r5 .r5h{display:flex;align-items:baseline;gap:10px;flex-wrap:nowrap}\n  .r5 .r5h b{font-size:22px;font-weight:700;color:#fff}\n  .r5 .map{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--amber);letter-spacing:.02em;white-space:nowrap}\n  .r5 p{font-size:16px;color:var(--blue-100);margin-top:6px;line-height:1.4}\n\n  /* diagram node */\n  .node{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 24px}\n  section.dark .node{background:rgba(255,255,255,.05);border-color:var(--line-dark)}\n\n  /* before/after rows */\n  .ba{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:11px 0;border-bottom:1px solid var(--line);font-size:18px}\n  .ba span{color:var(--ink-3);font-weight:500;flex:none}\n  .ba em{font-style:normal;color:var(--ink-2);text-align:right;font-weight:500}\n  .ba.good em{color:var(--ink);font-weight:600}\n\n  /* hotline steps */\n  .hstep{display:flex;align-items:center;gap:14px;font-size:19px;color:var(--ink-2)}\n  .hstep span{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:17px;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);color:var(--ink-2);flex:none}\n  .hstep b{color:var(--ink);font-weight:700}\n\n  /* feature pills */\n  .featpill{display:inline-flex;align-items:center;gap:10px;padding:12px 20px;background:#fff;border:1px solid var(--line);border-radius:999px;font-size:18px;font-weight:600;color:var(--ink)}\n  .featpill .ic{width:21px;height:21px;color:var(--blue);stroke-width:2}\n\n  /* workflow + ai rows */\n  .wstep{padding:6px 14px;background:#fff;border:1px solid var(--line);border-radius:9px;font-weight:600;color:var(--ink)}\n  .airow{display:flex;align-items:center;gap:11px;padding:11px 16px;background:var(--paper-2);border-radius:10px;font-size:18px;font-weight:600;color:var(--ink)}\n  .airow::before{content:\"\";width:9px;height:9px;border-radius:50%;background:var(--good);flex:none}\n\n  /* KPI big target */\n  .kpibig{font-weight:800;font-size:30px;color:var(--blue);font-variant-numeric:tabular-nums}\n\n  /* ROI rows */\n  .roirow{display:flex;align-items:center;justify-content:space-between;gap:24px;background:rgba(255,255,255,.05);border:1px solid var(--line-dark);border-radius:13px;padding:18px 24px}\n  .roilab{font-size:20px;color:var(--blue-100)}\n  .roival{font-size:22px;font-weight:700;color:#fff;text-align:right}\n  .roiarr{display:flex;justify-content:center;color:var(--amber)}\n  .roiarr .ic{width:30px;height:30px}\n\n  /* comparison matrix */\n  .ctab.cmp th,.ctab.cmp td{text-align:center;padding:15px 16px}\n  .ctab.cmp .lab{text-align:left}\n  .ctab.cmp thead th{font-size:15px}\n  .ctab.cmp .x{color:#c9d3de;font-size:24px;font-weight:700}\n  .ctab.cmp .y{color:var(--good);font-size:24px;font-weight:700}\n  .ctab.cmp .y2{color:var(--good);font-weight:700;font-size:18px}\n  .ctab.cmp .part{color:var(--amber-700);font-size:16px;font-weight:600}\n  .ctab.cmp th.hi{background:var(--navy-800);color:#fff;border-radius:10px 10px 0 0}\n  .ctab.cmp td.hi{background:rgba(43,108,176,.08)}\n\n  /* dashboard panels */\n  .dpanel{background:#fff;padding:22px 24px;display:flex;flex-direction:column;min-height:150px}\n  .dph{font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}\n  .dnum{font-size:30px;font-weight:800;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}\n  .dlab{font-size:13px;color:var(--ink-3);margin-top:3px}\n  .drow{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:16px;color:var(--ink-2);padding:7px 0;border-bottom:1px solid var(--paper-2)}\n  .drow:last-child{border-bottom:0}\n  .drow b{color:var(--ink);font-weight:700}\n\n  /* Q&A cards */\n  .qa{background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px 30px;display:flex;flex-direction:column}\n  .qmark{width:46px;height:46px;border-radius:12px;background:var(--navy-800);color:#fff;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:22px;display:flex;align-items:center;justify-content:center}\n  .qq{font-size:24px;font-weight:700;color:var(--ink);margin-top:18px;line-height:1.25}\n  .qa-line{height:1px;background:var(- "font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:.1em;color:var(--navy-900);opacity:.7\">CÂU HỎI DUY NHẤT<\u002Fdiv><div style=\"font-size:34px;font-weight:800;color:var(--navy-900);margin-top:6px;line-height:1.1\">Xin phép hẹn 1 buổi audit miễn phí trong tuần tới?<\u002Fdiv><\u002Fdiv>\n      <svg class=\"ic\" viewBox=\"0 0 24 24\" style=\"width:52px;height:52px;color:var(--navy-900);stroke-width:2.2\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"foot\"><span class=\"wm\" style=\"font-size:16px;color:rgba(255,255,255,.7)\">SingleInterface × Beta<\u002Fspan><span>Google Business Profile cho <b>MBV<\u002Fb><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<!-- SLIDES -->\n<\u002Fdeck-stage>\n\n<script type=\"application/json\" id=\"speaker-notes\">\n[\"Chào các anh chị. Trước khi em giới thiệu mình là ai, em muốn bắt đầu bằng một câu hỏi. Ngay lúc này, khi mình đang ngồi đây, có hàng nghìn người Việt đang mở Google và gõ ‘ngân hàng gần đây'. Câu hỏi duy nhất em muốn các anh chị giữ trong đầu suốt 30 phút tới là: trong những lần tìm kiếm đó, MBV có xuất hiện không? Em xin phép không nói về công ty em vội — em muốn nói về khách hàng của các anh chị trước.\",\"Đây là con số quan trọng nhất hôm nay. 70% lượt click rơi vào đúng 3 kết quả đầu tiên trên Google Maps — cái mà Google gọi là Map Pack. 30% còn lại chia cho tất cả website phía dưới. Nói cách khác: nếu chi nhánh MBV không nằm trong top 3 này, các anh chị không phải đang cạnh tranh yếu — mà gần như vô hình. Và điều đáng sợ là chuyện này xảy ra trước cả khi khách kịp nhìn thấy website đẹp của MBV.\",\"Em kể một câu chuyện. Anh Minh — một khách hàng điển hình. Anh ấy mới lập công ty, cần mở tài khoản doanh nghiệp. Anh ấy làm gì? Không gọi tổng đài, không vào website — anh ấy mở Google, gõ ‘ngân hàng gần đây'. Google hiện ba lựa chọn. MBV có chi nhánh cách đó 400 mét, nhưng không nằm trong ba cái đó. Anh Minh đến ngân hàng đối thủ, gọi một tap, chỉ đường một tap. Điểm mấu chốt em muốn nhấn mạnh: anh Minh không ghét MBV — anh ấy chỉ đơn giản là không thấy MBV. Và mỗi ngày có hàng nghìn anh Minh như vậy.\",\"Nhiều anh chị sẽ nghĩ: ‘MBV có website rồi mà'. Đúng. Nhưng vấn đề là thứ tự. Google Maps luôn xuất hiện TRƯỚC website. Bên trái là Map Pack — chỉ ba ngân hàng, có nút gọi, nút chỉ đường ngay trên màn hình đầu tiên, ăn 70% click. Bên phải là website — khách phải cuộn qua, click vào, rồi tự đi tìm chi nhánh, năm bảy bước. Dù website MBV đẹp đến đâu, nó vẫn nằm bên dưới. Cuộc đua thắng thua diễn ra ở Map Pack.\",\"Tại sao khách lại chọn Maps? Vì nó nhanh hơn. Nhìn bảng này: gọi điện — một tap so với tìm trang liên hệ, copy số. Chỉ đường — một tap so với tìm quận, copy địa chỉ. Xem đánh giá — thấy ngay 4.7 sao so với không có gì. Đặt lịch — một tap so với điền form chờ xác nhận. Quy luật rất đơn giản và em xin nhấn mạnh: khách hàng luôn chọn con đường ngắn nhất, luôn luôn. Mỗi bước thừa là một cơ hội để họ bỏ sang đối thủ.\",\"Vậy cụ thể MBV đang gặp những gì? Em liệt kê bảy vấn đề — các anh chị đọc nhanh thôi. Thông tin thiếu, giờ mở cửa sai, đánh giá xấu không ai phản hồi, không có ảnh chuyên nghiệp, ai cũng sửa được thông tin, quản lý rời rạc, và RM thì hoàn toàn vô hình online. Điều em muốn các anh chị cảm nhận: không vấn đề nào quá lớn. Nhưng cộng lại, mỗi ngày, ở mỗi chi nhánh, chúng âm thầm chuyển khách của MBV sang cho đối thủ — và không ai trong tổ chức nhìn thấy con số đó.\",\"Giờ em giải thích GBP là gì, thật đơn giản. Hãy hình dung nó như một tấm danh thiếp khổng lồ mà Google tự động dựng lên mỗi khi có người tìm kiếm — hoàn toàn miễn phí. Nó gồm chín thành phần các anh chị thấy trên màn hình: tên, sao, địa chỉ, giờ, điện thoại, ảnh, đánh giá, tin mới, hỏi đáp. Điểm quan trọng: tấm danh thiếp này LUÔN được dựng. Câu hỏi duy nhất là — nó đang hiển thị MBV, hay đang hiển thị đối thủ? Thông tin sai hoặc thiếu, Google sẽ chọn người khác.\",\"Một câu hỏi hay gặp: ‘GBP với website khác gì nhau?'. Em xin trả lời bằng bảng này. Cách cũ: khách phải biết tên MBV mới tìm được; phải chạy quảng cáo tốn tiền; mình tự nói về mình. Cách mới với GBP: Google tự hiển thị khi khách ở gần; miễn phí; và đánh giá là khách hàng thật nói, không phải mình tự khen. GBP không thay thế website — nó là cái cửa trước mà khách bước qua đầu tiên. Website là phòng khách phía sau. MBV cần cả hai, nhưng đúng thứ tự.\",\"Vậy làm sao để vào top 3? Google xếp hạng dựa trên ba yếu tố: độ liên quan, khoảng cách, và độ nổi bật. Từ ba yếu tố đó, bên em xây dựng phương pháp tối ưu gọi là 5R — các anh chị thấy bên phải. Mỗi chữ R ứng với một yếu tố của Google, nhưng quan trọng hơn: mỗi chữ R là một con số đo được. Triết lý của bên em là ‘không đo lường được thì không quản lý và tối ưu được' — nên mọi chỉ số 5R đều hiển thị real-time trên dashboard mà lát nữa em sẽ cho các anh chị xem.\",\"Giờ là giải pháp. Bên em là sự kết hợp của hai đơn vị: SingleInterface mang đến nền tảng công nghệ GBP để quản lý hàng trăm chi nhánh từ một dashboard; Beta mang đến dịch vụ — tối ưu nội dung, bảo vệ, tổng đài, RM profile, AI search. Em muốn nhấn mạnh phần dưới: nếu chỉ dùng một bên thì chưa đủ. Một mình platform thì thiếu nội dung và bảo vệ. Một mình dịch vụ thì khó scale 100 chi nhánh. Kết hợp lại — đó là một cộng một bằng ba: quản lý enterprise cộng tối ưu sâu cộng bảo vệ cộng compliance.\",\"Đây là ý tưởng chiến lược cốt lõi: mô hình Hub và Spoke. Mỗi chi nhánh là một cửa hàng số. Mỗi RM cũng là một điểm hiện diện riêng. Càng nhiều điểm hiện diện chất lượng, MBV càng chiếm nhiều vị trí trên Maps, và đối thủ càng khó chen vào. Hãy tưởng tượng khi khách search ‘vay mua nhà Quận 1' — MBV chiếm hai trong ba vị trí Map Pack: một là chi nhánh, một là RM. Đối thủ chỉ còn đúng một slot.\",\"Giải pháp đầu tiên, cũng là nền tảng: tối ưu chi nhánh. Bên trái là một profile bị bỏ rơi — tên chung chung, một danh mục, mô tả trống, không ảnh, 3.5 sao, không bài đăng. Bên phải là sau khi tối ưu — tên rõ ràng, bốn danh mục, mô tả riêng, hơn 50 ảnh, 4.5 sao với phản hồi trong 24 giờ, bài đăng đều đặn. Em muốn các anh chị hiểu: tối ưu không phải chỉ là điền thông tin. Đó là một chiến lược nội dung riêng cho từng chi nhánh — và đây chính là thứ không thể làm thủ công ở quy mô 100 chi nhánh.\",\"Giải pháp thứ hai, và đây là phần em tâm đắc nhất: RM Profile. Mỗi Relationship Manager trở thành một cố vấn tài chính có mặt trên Google Maps. Nhìn bên trái: khi khách tìm ‘tư vấn vay mua nhà Quận 1', họ thấy chi nhánh MBV ở vị trí một, RM Nguyễn Văn A ở vị trí hai — MBV chiếm hai phần ba. Và đây là điểm vàng: hiện tại CHƯA có RM ngân hàng nào ở Việt Nam có GBP cá nhân. Đây là đại dương xanh. MBV có thể là người đầu tiên.\",\"Giải pháp thứ ba xử lý một rủi ro mà ít anh chị biết. Ngay lúc này, bất kỳ ai — kể cả đối thủ — đều có thể vào sửa thông tin chi nhánh MBV trên Google qua tính năng ‘Suggest an edit'. Và Google không cho phép tắt tính năng này. Họ có thể đổi giờ, đổi số điện thoại, thậm chí đánh dấu ‘đã đóng cửa vĩnh viễn'. Giải pháp của bên em: hệ thống quét mỗi 15 phút, tự động hoàn tác nếu sai, báo HQ nếu cần xem xét, và ghi log tất cả. Với 100 chi nhánh, kiểm tra thủ công là bất khả thi — bảo vệ tự động là bắt buộc.\",\"Giải pháp thứ tư giải quyết một nỗi đau rất thực tế của ngân hàng: nhân sự nghỉ việc. Bên trái — không có tổng đài: khách gọi vào số cá nhân của RM, RM nghỉ và mang theo số, MBV mất khách vĩnh viễn. Bên phải — có tổng đài Beta: GBP hiển thị số tổng đài tập trung, RM nghỉ thì cuộc gọi tự chuyển sang RM mới, zero data loss. Thông điệp đơn giản: khách hàng thuộc về MBV, không thuộc về một nhân viên. Và mọi cuộc gọi đều được đo lường.\",\"Giải pháp thứ năm — phần sáng tạo. Khi HQ cập nhật lãi suất mới, một lần thôi, hệ thống tự động tạo bài đăng riêng cho từng chi nhánh và hiển thị ngay trên Google Maps, như cái bài đăng các anh chị thấy bên phải: ‘Lãi suất vay mua nhà tại Chi nhánh Q1: 7.5% — liên hệ RM Nguyễn Văn A'. Tức là biến 100 chi nhánh thành 100 bảng quảng cáo số cập nhật real-time. Em xin nhấn mạnh: không một ngân hàng nào ở Việt Nam đang làm điều này. MBV sẽ là đầu tiên.\",\"Ba giải pháp cuối em gói gọn trong một slide vì chúng đều được thiết kế riêng cho ngành ngân hàng. Một: Compliance Workflow — mọi nội dung đều qua quy trình Beta soạn, HQ MBV duyệt, rồi mới đăng. Hai: Branch Health Score — mỗi chi nhánh có điểm 0 đến 100, HQ nhận cảnh báo tự động khi điểm dưới 70. Ba: AI Search — đảm bảo MBV xuất hiện khi khách hỏi ChatGPT, Google AI hay Perplexity, đây là xu hướng của 2025-2026. Tóm lại: mọi nội dung được duyệt, mọi chi nhánh được chấm điểm, mọi xu hướng tương lai được cover.\",\"Giờ em chuyển sang phần các anh chị quan tâm nhất: con số. Bên em không nói chung chung, bên em cam kết bằng KPI cụ thể sau 6 tháng. Chi nhánh vào top 3 Maps: từ dưới 20% lên ít nhất 60%. Cuộc gọi từ Maps: từ chỗ không đo được lên 500 cuộc mỗi tháng. Lượt chỉ đường: 1.000 lượt. Đánh giá trung bình: lên 4.5 sao. Phản hồi đánh giá: 100% trong 24 giờ. Và đây không phải lời hứa suông — mỗi con số đều hiển thị trên dashboard real-time để HQ kiểm chứng bất cứ lúc nào.\",\"Còn về ROI thì sao? Em làm một phép tính minh hoạ. Chi phí cho 100 chi nhánh khoảng 150 đến 250 triệu một tháng. Với 50 leads mỗi tháng, chuyển đổi 20%, ra 10 khách mới. Mỗi khách vay mua nhà có giá trị khoảng 500 triệu lãi trong 5 năm. Kết quả: ROI trên 1.000%. Câu em muốn các anh chị nhớ: chi phí GBP cho cả 100 chi nhánh trong một tháng còn thấp hơn chi phí một vài cú click Google Ads — nhưng nó tạo ra dòng khách hàng bền vững, không phải trả tiền theo từng click.\",\"Có anh chị sẽ hỏi: ‘sao không chạy quảng cáo, không làm app cho rồi?'. Em xin so sánh thẳng. Map Pack — chỉ GBP làm được. Click-to-call miễn phí — chỉ GBP. Chỉ đường một tap, đánh giá khách thật, bảo vệ 24/7, AI search — đều chỉ GBP. Còn chi phí mỗi lead: website cao, app rất cao, Ads thì trả từng click; GBP thì cố định và thấp. GBP không thay thế các kênh khác — nó chiếm lĩnh đúng cái khoảng trống mà không kênh nào với tới được: khoảnh khắc khách tìm ‘gần đây'.\",\"Và đây là thứ HQ MBV sẽ thấy hằng ngày — một dashboard duy nhất cho toàn mạng lưới. Tổng quan cuộc gọi, chỉ đường, đánh giá. Xếp hạng chi nhánh theo Health Score. Hiệu suất từng RM. Cảnh báo đánh giá 1-2 sao cần xử lý gấp. Log các chỉnh sửa trái phép đã bị chặn. Lịch sử bài đăng lãi suất tự động. Tất cả real-time, mọi chi nhánh, mọi RM. Toàn bộ mạng lưới nằm gọn trong tầm tay các anh chị.\",\"Em biết các anh chị đang có những băn khoăn, nên em xin chủ động trả lời trước. ‘MBV có website rồi, cần gì GBP?' — Website nằm dưới Map Pack, GBP nằm trên cùng và khách gọi trực tiếp. ‘GBP miễn phí mà, sao phải trả phí?' — GBP là đất trống miễn phí; bên em là kiến trúc sư, người quản lý toà nhà và bảo vệ; có đất mà không xây nhà thì không ai ở. ‘Compliance có đảm bảo không?' — mọi nội dung đều qua HQ duyệt trước khi đăng, template đã pre-approved, zero risk.\",\"Em xin xoá nốt ba băn khoăn nữa. ‘Sợ nhân viên nghỉ mất data?' — tổng đài tập trung giữ mọi data, ownership thuộc về MBV, zero risk. ‘Sợ Google đổi chính sách?' — team Beta theo dõi guidelines 24/7, và chi nhánh ngân hàng là loại hình hợp lệ nhất trên GBP nên rủi ro thấp nhất. ‘Bao lâu thấy kết quả?' — tuần một hai profile hoàn thiện, tháng một hai bắt đầu lên Map Pack, tháng ba đến sáu ROI rõ ràng. Khi mọi rủi ro lớn đã được xử lý trước khi các anh chị hỏi, thì quyết định trở nên dễ dàng hơn nhiều.\",\"Và để các anh chị hoàn toàn yên tâm, đây là lộ trình. Bốn giai đoạn trong 6 tháng. Giai đoạn một: pilot 10 chi nhánh, setup và go-live. Giai đoạn hai: ổn định, thu đánh giá, track ranking. Giai đoạn ba: mở rộng 50 chi nhánh, thêm RM, bật Rate Alert và Health Score. Giai đoạn bốn: toàn hệ thống, AI Search và báo cáo ROI đầy đủ. Điểm cốt lõi: các anh chị chỉ scale khi đã thấy kết quả thật từ pilot. Mỗi giai đoạn là một điểm kiểm chứng — không ai bắt MBV cam kết toàn bộ ngay từ đầu.\",\"Trước khi đến bước cuối, em muốn nhắc lại tại sao thời điểm này quan trọng. MBV có cơ hội trở thành ngân hàng đầu tiên ở Việt Nam tối ưu GBP. Ba lợi thế: first-mover — ai chiếm trước thì chiếm lâu dài; moat — fintech và portal không thể tạo GBP vì không có chi nhánh thật, chỉ ngân hàng thật mới làm được; và blue ocean — chưa RM ngân hàng nào có GBP cá nhân. Nhưng em phải nói thật: cơ hội first-mover có thời hạn. Khi đối thủ bắt đầu, chi phí sẽ cao hơn và hiệu quả sẽ thấp hơn.\",\"[Slide dự phòng — minh hoạ kết quả cuối cùng] Đây là bức tranh khi MBV tối ưu đầy đủ. Khách tìm ‘vay mua nhà lãi suất thấp Quận 1': vị trí một là chi nhánh MBV với bài Rate Alert lãi suất 7.5%, vị trí hai là RM Nguyễn Văn A 4.9 sao, vị trí ba mới đến đối thủ. MBV chiếm hai phần ba top 3, đối thủ bị đẩy xuống dưới, và 70% traffic chuyển về MBV. Đây không phải mơ ước — đây là kết quả tự nhiên của việc tối ưu đầy đủ và bài bản. Cảm ơn các anh chị, em sẵn sàng cho phần hỏi đáp.\",\"Vậy bước tiếp theo là gì? Em không xin các anh chị ký hợp đồng hôm nay. Em chỉ xin một thứ nhỏ thôi: cho bên em làm một buổi Audit miễn phí trong 3 đến 5 ngày — bên em phân tích 5 chi nhánh MBV so với 5 chi nhánh đối thủ và đưa ra báo cáo chi tiết. Từ đó mới đến demo, rồi pilot, rồi scale. Bên em cam kết: KPI rõ ràng, báo cáo minh bạch, compliance, không mất data, bảo vệ 24/7, account manager riêng. Nên câu hỏi duy nhất em xin phép hỏi hôm nay là: các anh chị cho phép bên em hẹn một buổi audit miễn phí trong tuần tới chứ?\"]\n<\u002Fscript>\n<script src=\"e6a6755c-89b4-46aa-9705-75059ca92224\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
